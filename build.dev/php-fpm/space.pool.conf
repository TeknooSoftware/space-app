[www]

user = www-data
group = www-data
listen = 0.0.0.0:9000
chdir = /var/www/space/
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
request_slowlog_timeout = 3s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

;---------------------
; Only the variables the web process reads reach PHP (clear_env = yes below).
; Provisioning settings (OCI registry, cluster issuer, HNC, storage, SPACE_DC_*) belong to the new_task worker.
env[APP_ENV] = $APP_ENV
env[APP_REMEMBER_SECRET] = $APP_REMEMBER_SECRET
env[APP_SECRET] = $APP_SECRET
env[MAILER_DSN] = $MAILER_DSN
env[MAILER_FORBIDDEN_WORDS] = $MAILER_FORBIDDEN_WORDS
env[MAILER_REPLY_TO_ADDRESS] = $MAILER_REPLY_TO_ADDRESS
