mercure:
    hubs:
        default:
            # Never empty: MercureBundle selects FrankenPHP's built-in hub for an empty URL, and builds it
            # with Twig, but its `mercure_publish()` function exists neither for the CLI workers nor for FPM.
            url: '%env(default:teknoo.space.default.mercure.publish_url:MERCURE_PUBLISH_URL)%'
            public_url: '%env(MERCURE_SUBSCRIBER_URL)%'
            # Driven by the MERCURE_PROTOCOL_VERSION environment variable, read in
            # `config/di.variables.php`: MercureBundle turns this value into a `ProtocolVersion`
            # enum case while the container is compiled, so an `%env()%` placeholder, which only
            # gets its value at runtime, can not be used here.
            protocol_version: '%teknoo.space.mercure.protocol_version%'
            # Always set: without it, MercureBundle names the cookie `mercure_access_token` in debug mode with the
            # protocol 1.0, the name of the hub's playground mode, ignored by the hub. Empty, the fallback is null and
            # the hub uses the cookie name of its protocol: `mercureAuthorization` for 0.x,
            # `__Secure-mercure_access_token` for 1.0.
            cookie_name: '%env(default::MERCURE_COOKIE_NAME)%'
            jwt:
                secret: '%env(MERCURE_JWT_TOKEN)%'
                publish: [ '*' ]
                subscribe: [ '*' ]
                algorithm: 'hmac.sha256'
                # Required by the RFC 9068 access tokens of the Mercure protocol 1.0, and ignored
                # by a 0.x hub, which only reads the `mercure` claim. `iss` must match the issuer
                # trusted by the hub; `aud` is derived from `public_url`.
                claims:
                    iss: '%env(default:teknoo.space.default.mercure.jwt_issuer:MERCURE_JWT_ISSUER)%'
                    sub: 'teknoo-space'
                    client_id: 'teknoo-space'
