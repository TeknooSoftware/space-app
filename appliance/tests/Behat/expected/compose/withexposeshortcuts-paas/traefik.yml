http:
    routers:
        space-client-my-company-prod-myproject-demo-nginx:
            rule: 'Host(`demo-paas.teknoo.software`) || Host(`alias1.demo-paas.teknoo.software`) || Host(`alias2.demo-paas.teknoo.software`)'
            entryPoints:
                - websecure
            service: space-client-my-company-prod-myproject-demo-nginx-default
            tls: {  }
        space-client-my-company-prod-myproject-demo-nginx-php-pods-php-run-9876:
            rule: '(Host(`demo-paas.teknoo.software`) || Host(`alias1.demo-paas.teknoo.software`) || Host(`alias2.demo-paas.teknoo.software`)) && PathPrefix(`/php`)'
            entryPoints:
                - websecure
            service: space-client-my-company-prod-myproject-demo-nginx-php-pods-php-run-9876
            tls: {  }
        space-client-my-company-prod-myproject-demo-secure:
            rule: Host(`demo-secure.teknoo.software`)
            entryPoints:
                - websecure
            service: space-client-my-company-prod-myproject-demo-secure-default
            tls: {  }
    services:
        space-client-my-company-prod-myproject-demo-nginx-default:
            loadBalancer:
                servers:
                    -
                        url: 'http://demo.space-client-my-company-prod-myproject-private:8080'
        space-client-my-company-prod-myproject-demo-nginx-php-pods-php-run-9876:
            loadBalancer:
                servers:
                    -
                        url: 'http://php-pods.space-client-my-company-prod-myproject-private:8080'
        space-client-my-company-prod-myproject-demo-secure-default:
            loadBalancer:
                servers:
                    -
                        url: 'https://demo.space-client-my-company-prod-myproject-private:8181'
