services:
    demo-extra-myproject-volume-init:
        image: my-company.registry.demo.teknoo.space/extra-myproject
        environment:
            MOUNT_PATH: /opt/extra
        volumes:
            - 'demo-extra-myproject-volume:/opt/extra'
        network_mode: none
        restart: 'no'
    php-pods:
        image: 'my-company.registry.demo.teknoo.space/php-run:7.4-09597-1e225-prod'
        networks:
            space-client-my-company-prod-demo-myproject-private:
                aliases:
                    - php-service
        expose:
            - 8080
        env_file:
            - ./secrets/php-pods-php-run.env
        environment:
            SERVER_SCRIPT: /opt/app/src/server.php
        volumes:
            - 'demo-extra-myproject-volume:/opt/extra:ro'
            - 'demo-data-09597-1e225:/opt/data'
            - 'demo-data-replicated:/opt/data-replicated'
        secrets:
            -
                source: demo-volume-vault-secret-foo
                target: /vault/foo
            -
                source: demo-volume-vault-secret-bar
                target: /vault/bar
        configs:
            -
                source: demo-map2-map-foo
                target: /map/foo
            -
                source: demo-map2-map-bar
                target: /map/bar
        depends_on:
            demo-extra-myproject-volume-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD-SHELL
                - 'ps aux php'
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 1
        deploy:
            replicas: 2
    shell:
        image: 'registry.hub.docker.com/bash:alpine'
        networks:
            - space-client-my-company-prod-demo-myproject-private
    demo:
        image: 'my-company.registry.demo.teknoo.space/nginx:alpine-2a975-5be1e-prod'
        networks:
            - space-client-my-company-prod-demo-myproject-private
        expose:
            - 8080
            - 8181
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl -fk https://localhost:8080/status || exit 1'
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 2
        group_add:
            - '1000'
    demo-waf:
        image: 'registry.hub.docker.com/library/waf:alpine'
        healthcheck:
            test:
                - CMD-SHELL
                - 'nc -z localhost 8181 || exit 1'
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 1
        group_add:
            - '1000'
        network_mode: 'service:demo'
    demo-blackfire:
        image: 'blackfire/blackfire:2-prod'
        environment:
            BLACKFIRE_SERVER_ID: foo
            BLACKFIRE_SERVER_TOKEN: bar
        group_add:
            - '1000'
        network_mode: 'service:demo'
networks:
    space-client-my-company-prod-demo-myproject-private:
        name: space-client-my-company-prod-demo-myproject-private
        driver: bridge
volumes:
    demo-data-09597-1e225:
        driver: local
    demo-data-replicated:
        driver: local
    demo-extra-myproject-volume:
        driver: local
configs:
    demo-map1-map-key1:
        file: ./configs/demo-map1-map/key1
    demo-map1-map-key2:
        file: ./configs/demo-map1-map/key2
    demo-map2-map-foo:
        file: ./configs/demo-map2-map/foo
    demo-map2-map-bar:
        file: ./configs/demo-map2-map/bar
secrets:
    demo-map-vault-secret-key1:
        file: ./secrets/demo-map-vault-secret/key1
    demo-map-vault-secret-key2:
        file: ./secrets/demo-map-vault-secret/key2
    demo-map-vault2-secret-hello:
        file: ./secrets/demo-map-vault2-secret/hello
    demo-volume-vault-secret-foo:
        file: ./secrets/demo-volume-vault-secret/foo
    demo-volume-vault-secret-bar:
        file: ./secrets/demo-volume-vault-secret/bar
